name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements-dev.txt
      - name: Check formatting
        run: python -m ruff format --check app tests tools
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy app
      - name: Static security scan
        run: python -m bandit -r app tools -q
      - name: Dead-code scan
        run: python -m vulture app --min-confidence 90 --ignore-names cls
      - name: Test
        run: python -m pytest -q
      - name: Verify environment
        run: python -m pip check
      - name: Audit runtime dependencies
        run: python -m pip_audit -r app/requirements.txt
