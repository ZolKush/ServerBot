name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14.7"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements-dev.txt
      - name: Check formatting
        run: python -m ruff format --check app tests tools deploy/maintbot-helper
      - name: Lint
        run: python -m ruff check . deploy/maintbot-helper
      - name: Type check
        run: python -m mypy app
      - name: Static security scan
        run: python -m bandit -r app tools deploy/maintbot-helper -q
      - name: Dead-code scan
        run: python -m vulture app --min-confidence 90 --ignore-names cls
      - name: Test
        run: python -m pytest -q
      - name: Verify environment
        run: python -m pip check
      - name: Audit runtime dependencies
        run: python -m pip_audit -r app/requirements.txt
      - name: Audit development dependencies
        run: python -m pip_audit -r app/requirements-dev.txt
